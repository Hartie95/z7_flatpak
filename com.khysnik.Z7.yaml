id: com.khysnik.Z7
sdk: org.gnome.Sdk
runtime: org.gnome.Platform
runtime-version: '50'
base: org.winehq.Wine
base-version: wow64-25.08
command: Z7Launcher
tags: [proprietary]
separate-locales: false
finish-args:
  # Copy some args from Steam Flatpak to make the environment similar
  # to Proton apps running under Steam Flatpak. Arguments only related to
  # native titles or the Steam client are omitted.
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  - --share=network
  # Steam in -steamos mode uses Network Manager for network settings, e.g.
  # connecting to wifi and so on.
  # In normal mode, it probably just gets info about current connection status.
  - --system-talk-name=org.freedesktop.NetworkManager
  # Wine uses UDisks2 to enumerate disk drives
  - --system-talk-name=org.freedesktop.UDisks2
  - --device=all
  - --allow=multiarch
  - --allow=devel
  - --allow=bluetooth
  - --allow=per-app-dev-shm
  - --env=LC_ADDRESS=C
  - --env=LC_COLLATE=C
  - --env=LC_MONETARY=C
  - --env=LC_MEASUREMENT=C
  - --env=LC_NAME=C
  - --env=LC_NUMERIC=C
  - --env=LC_TELEPHONE=C
  - --env=ALSA_CONFIG_PATH=
  - --unset-env=ALSA_CONFIG_PATH
  - --env=MESA_GLSL_CACHE_DIR=
  - --unset-env=MESA_GLSL_CACHE_DIR
  - --env=STEAM_RUNTIME_PREFER_HOST_LIBRARIES=
  - --unset-env=STEAM_RUNTIME_PREFER_HOST_LIBRARIES
  - --env=STEAM_RUNTIME=
  - --unset-env=STEAM_RUNTIME
  - --env=STEAM_EXTRA_COMPAT_TOOLS_PATHS=/app/share/steam/compatibilitytools.d
  - --env=PROTON_DEBUG_DIR=/var/tmp
  - --env=XDG_CONFIG_DIRS=/etc/xdg:/usr/lib/x86_64-linux-gnu/GL:/usr/lib/i386-linux-gnu/GL
  - --env=GST_PLUGIN_SYSTEM_PATH=/app/lib/gstreamer-1.0:/app/lib32/gstreamer-1.0:/usr/lib/extensions/gstreamer-1.0:/usr/lib/x86_64-linux-gnu/gstreamer-1.0:/usr/lib/i386-linux-gnu/gstreamer-1.0
  - --require-version=1.0.0

  # Protontricks-specific permissions to grant access to Steam installation
  - --filesystem=~/.var/app/com.valvesoftware.Steam
  - --filesystem=~/.local/share/Steam
  - --filesystem=~/.steam
  - --filesystem=~/snap/steam
  - --filesystem=~/.snap/data/steam  # For 'experimental.hidden-snap-folder'

  # Common home directories used by Wine and many Windows programs
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  - --filesystem=xdg-music
  - --filesystem=xdg-videos
  - --filesystem=xdg-download

modules:
  - name: Z7
    buildsystem: simple
    build-commands:
      - chmod +x z7/Z7Launcher
      - chmod +x z7/BlazeServer
      - chmod +x z7/gw2-server

      - install -Dm0755 z7launcher.sh "${FLATPAK_DEST}/bin/Z7Launcher"
      - install -Dm0755 BlazeServer.sh "${FLATPAK_DEST}/bin/BlazeServer"
      - install -Dm0755 gw2-server.sh "${FLATPAK_DEST}/bin/gw2-server"
      - install -Dm0755 utils.sh "${FLATPAK_DEST}/z7/utils.sh"
      - install -Dm0755 all-servers.sh "${FLATPAK_DEST}/bin/servers"
      - install -Dm0644 "${FLATPAK_ID}.metainfo.xml" "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - |
        for size in 16 22 24 32 48 64 96 128 256 512; do
          install -Dm0644 "icons/${size}x${size}.png" "${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png"
        done
      - install -Dm0644 "z7-launcher.desktop" "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - desktop-file-edit --set-key=Icon --set-value="${FLATPAK_ID}" "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - desktop-file-edit --set-key=X-Flatpak-RenamedFrom --set-value='z7-launcher.desktop;' "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - cp -a ./z7 "${FLATPAK_DEST}"
    sources:
      - type: archive
        dest: z7
        strip-components: 0
        url: https://github.com/Khysnik/Z7/releases/download/v1.1.0/Z7-1.1.0-Linux-Beta.zip
        sha256: e3318d5df6f907a44182727326f6d9c3256c6aacf96065488acd7d7861ef65da
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Khysnik/Z7/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name
          url-query: '[.assets[] | select(.name | contains("Linux"))] | first | .browser_download_url'
          is-main-source: true
        only-arches:
          - x86_64
      - type: file
        path: z7launcher.sh
      - type: file
        path: BlazeServer.sh
      - type: file
        path: gw2-server.sh
      - type: file
        path: all-servers.sh
      - type: file
        path: utils.sh
      - type: file
        path: com.khysnik.Z7.metainfo.xml
      - type: file
        path: z7-launcher.desktop
      - type: dir
        path: icons
        dest: icons
